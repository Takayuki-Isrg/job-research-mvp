<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>業務改善エンジニア</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "JobPosting",
            "title": "業務改善エンジニア",
            "description": "社内システムの改善と業務効率化を担当します。",
            "hiringOrganization": {
              "@type": "Organization",
              "name": "サンプル株式会社"
            },
            "employmentType": "FULL_TIME",
            "jobLocation": {
              "@type": "Place",
              "address": {
                "@type": "PostalAddress",
                "addressRegion": "東京都",
                "addressLocality": "港区"
              }
            },
            "baseSalary": {
              "@type": "MonetaryAmount",
              "currency": "JPY",
              "value": {
                "minValue": 4500000,
                "maxValue": 7000000,
                "unitText": "YEAR"
              }
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <main>
      <h1>業務改善エンジニア</h1>
      <p>社内システムの改善と業務効率化を担当します。</p>
      <p>サンプル株式会社</p>
    </main>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>RA項目区画の再現</title>
  </head>
  <body>
    <!-- Structure is based on shared DOM/screenshots. Text and undisclosed location details are synthetic. -->
    <main>
      <p class="JobInformation_corpName__TEST">検証用サンプル株式会社</p>
      <h1 class="JobInformation_title__TEST">AI活用推進エンジニア</h1>
      <section aria-labelledby=":job:test:">
        <h2 id=":job:test:" class="MainSection_title__TEST">職務内容</h2>
        <div class="MainSection_contents__TEST">
          <section
            aria-labelledby=":description:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":description:test:" class="MidSection_categoryTitle__TEST">
              仕事内容
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              <p>社内のAI活用と業務改善を担当します。</p>
            </div>
          </section>
          <section
            aria-labelledby=":experience:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":experience:test:" class="MidSection_categoryTitle__TEST">
              <span><img alt="" /></span>求める能力・経験
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              <p>【必須】業務プロセスの改善経験</p>
              <p>【歓迎】AI関連ルールの策定経験</p>
              <p>学歴：大学・大学院</p>
            </div>
          </section>
        </div>
      </section>
      <section aria-labelledby=":conditions:test:">
        <h2 id=":conditions:test:" class="MainSection_title__TEST">勤務条件</h2>
        <div class="MainSection_contents__TEST">
          <section
            aria-labelledby=":employment:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":employment:test:" class="MidSection_categoryTitle__TEST">
              雇用形態
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              正社員（試用期間あり）
            </div>
          </section>
          <section
            aria-labelledby=":salary:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":salary:test:" class="MidSection_categoryTitle__TEST">
              給与
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              年収500万円〜700万円
            </div>
          </section>
        </div>
      </section>
      <section aria-labelledby=":location:test:">
        <h2 id=":location:test:" class="MainSection_title__TEST">勤務地</h2>
        <div class="MainSection_contents__TEST">
          <section
            aria-labelledby=":assignment:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":assignment:test:" class="MidSection_categoryTitle__TEST">
              配属先
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              DX推進部。残業は月20時間程度。
            </div>
          </section>
          <section
            aria-labelledby=":transfer:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":transfer:test:" class="MidSection_categoryTitle__TEST">
              転勤
            </h3>
            <div class="MidSection_categoryDesc__TEST">無</div>
          </section>
          <section
            aria-labelledby=":office:test:"
            class="MidSection_categoryBox__TEST"
          >
            <h3 id=":office:test:" class="MidSection_categoryTitle__TEST">
              勤務地
            </h3>
            <div class="MidSection_categoryDesc__TEST">
              <p>検証オフィス</p>
              <p>住所：東京都千代田区の検証用住所</p>
              <p>最寄駅：検証駅 徒歩5分</p>
            </div>
          </section>
        </div>
      </section>
      <section aria-labelledby=":selection:test:">
        <h2 id=":selection:test:" class="MainSection_title__TEST">選考内容</h2>
        <div class="MainSection_contents__TEST">面接2回</div>
      </section>
    </main>
  </body>
</html>

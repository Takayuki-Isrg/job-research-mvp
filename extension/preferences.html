<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>求人検索ツール | 希望条件</title>
    <link rel="stylesheet" href="review.css" />
    <link rel="stylesheet" href="preferences.css" />
    <script type="module" src="preferences.js"></script>
  </head>
  <body>
    <main class="preferences">
      <header>
        <p class="eyebrow">求人調査 MVP / 希望条件の管理</p>
        <h1>求人検索ツール</h1>
      </header>
      <section class="panel" aria-labelledby="preferences-heading">
        <label id="preferences-heading" for="preferences-text">希望条件</label>
        <textarea
          id="preferences-text"
          placeholder="希望する職種、勤務地、除外条件などを入力"
          spellcheck="false"
          disabled
        ></textarea>
        <div class="preferences-meta">
          <p
            id="save-status"
            role="status"
            aria-live="polite"
            data-state="loading"
          >
            保存済みの希望条件を読み込んでいます…
          </p>
          <p id="char-count" class="muted"></p>
        </div>
        <p class="muted">
          希望条件は自動で保存されます（入力が止まってから約1秒後、このPCのChromeに保存）。求人の確認画面では、分析結果がない求人の初期値として読み込みます。確認画面で変更しても、ここに保存した内容は変わりません。
        </p>
        <p id="preferences-error" class="callout error" role="alert" hidden></p>
        <div class="preferences-actions">
          <button type="button" id="import" class="secondary" disabled>
            希望条件をインポートする
          </button>
          <button type="button" id="export" class="secondary" disabled>
            希望条件をエクスポートする
          </button>
          <button type="button" id="retry" hidden>もう一度保存する</button>
        </div>
        <input type="file" id="import-file" accept=".txt,text/plain" hidden />
        <p class="muted">
          インポート・エクスポートはUTF-8のテキストファイル（.txt）です。インポートすると現在の内容を置き換えるため、実行前に確認します。
        </p>
      </section>
    </main>
  </body>
</html>
